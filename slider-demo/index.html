<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>דוגמה: לפני ואחרי</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600&family=Heebo:wght@200;300&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E1214;--ink-soft:#5B4646;--accent:#7D1631;--paper:#FBF6F1;--rule:#CCB2A3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Assistant',sans-serif;direction:rtl;padding:48px 20px 64px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:200 2.4rem/1.1 'Heebo',sans-serif;color:var(--ink)}
.lede{font-size:1.05rem;line-height:1.7;color:var(--ink-soft);font-weight:300}
.lab{display:grid;grid-template-columns:1fr 1fr;font-size:.9rem;font-weight:600;letter-spacing:.04em;color:var(--ink-soft);text-align:center}

/* הסליידר: ה"אחרי" למטה, ה"לפני" מעליו ונחשף מימין. הקו נגרר עם האצבע או העכבר. */
.ba{position:relative;aspect-ratio:9/16;background:#fff;border:1px solid var(--rule);padding:4px;touch-action:pan-y;user-select:none;-webkit-user-select:none;--p:50%}
.ba-in{position:relative;width:100%;height:100%;overflow:hidden}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ba .before{clip-path:inset(0 0 0 var(--p))}
.ba-line{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.18);pointer-events:none}
.ba-knob{position:absolute;top:50%;left:var(--p);width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#fff;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.ba-knob svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* שדה הטווח מכסה את כל המסגרת ושקוף, ולכן גם מקלדת וקוראי מסך עובדים */
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;direction:ltr;margin:0}
.name{text-align:center;font-weight:600}
.hint{text-align:center;font-size:.85rem;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="wrap">
  <h1>לפני ואחרי</h1>
  <p class="lede">גוררים את הקו כדי לראות את ההבדל. דוגמה לזוג אחד, כדי לבחור לפני שמעבירים את כולם.</p>
  <div class="lab"><span>לפני</span><span>אחרי</span></div>
  <div class="ba" id="ba1">
    <div class="ba-in">
      <img class="after" src="slider-A-after.jpg" alt="אלכסנדרה אחרי תהליך הסטיילינג">
      <img class="before" src="slider-A-before.jpg" alt="אלכסנדרה לפני תהליך הסטיילינג">
      <div class="ba-line"></div>
      <div class="ba-knob"><svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg></div>
    </div>
    <input type="range" min="0" max="100" value="50" aria-label="גרירה בין לפני לאחרי">
  </div>
  <p class="name">אלכסנדרה</p>
  <p class="hint">אפשר גם להחליק עם האצבע על התמונה</p>
</div>
<script>
document.querySelectorAll('.ba').forEach(function(b){
  var r=b.querySelector('input');
  function set(){b.style.setProperty('--p',r.value+'%')}
  r.addEventListener('input',set);set();
});
</script>
</body>
</html>
