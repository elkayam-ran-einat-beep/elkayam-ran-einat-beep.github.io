name: glilot-collect
on:
  schedule:
    - cron: "17 1 * * *"   # every night, about 03:17 Israel time
  workflow_dispatch:
    inputs:
      stores:
        description: "Stores to collect (blank = all)"
        required: false
permissions:
  contents: write
concurrency: glilot-collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/glilot/collect.py ${{ github.event.inputs.stores }}
      - name: Save the new data
        run: |
          git config user.name "glilot-bot"
          git config user.email "glilot-bot@users.noreply.github.com"
          cp -r glilot/data /tmp/newdata
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/glilot/save.py /tmp/newdata
            git add glilot/data
            git diff --cached --quiet && exit 0
            git commit -qm "פורטל גלילות: עדכון פריטים"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 7))
          done
          exit 1
