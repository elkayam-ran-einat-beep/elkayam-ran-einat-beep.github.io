name: glilot-collect
on:
  schedule:
    - cron: "17 1 * * *"   # every night, about 03:17 Israel time
  workflow_dispatch:
    inputs:
      stores:
        description: "Stores to collect (blank = all)"
        required: false
permissions:
  contents: write
concurrency: glilot-collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/glilot/collect.py ${{ github.event.inputs.stores }}
      - name: Save the new data
        run: |
          git config user.name "glilot-bot"
          git config user.email "glilot-bot@users.noreply.github.com"
          git add glilot/data
          git diff --cached --quiet && exit 0
          git commit -m "פורטל גלילות: עדכון פריטים"
          git pull --rebase -q && git push
