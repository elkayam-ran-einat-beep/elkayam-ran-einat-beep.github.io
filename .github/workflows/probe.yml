name: probe
on:
  workflow_dispatch:
    inputs:
      args: {description: urls, required: true}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out; i=0
          for u in ${{ github.event.inputs.args }}; do i=$((i+1))
            curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" \
              -H "Accept-Language: he-IL,he;q=0.9" -o out/$i.html -w "$i %{http_code} %{size_download} $u\n" "$u" || true
          done
      - uses: actions/upload-artifact@v4
        with: {name: pages, path: out, retention-days: 1}
