name: probe
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      args: {description: urls, required: true}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          ARGS: ${{ github.event.inputs.args }}
        run: |
          mkdir -p out; i=0
          for u in $ARGS; do i=$((i+1))
            curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" \
              -H "Accept-Language: he-IL,he;q=0.9,en;q=0.8" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
              -H "sec-ch-ua: \"Chromium\";v=\"130\", \"Google Chrome\";v=\"130\"" -H "sec-ch-ua-mobile: ?0" -H "sec-ch-ua-platform: \"Windows\"" \
              -H "Sec-Fetch-Dest: document" -H "Sec-Fetch-Mode: navigate" -H "Sec-Fetch-Site: none" -H "Upgrade-Insecure-Requests: 1" --compressed -o out/$i.html -w "$i %{http_code} %{size_download} $u\n" "$u" || true
          done
      - run: |
          cd out && git init -q && git checkout -q -b probe-data && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-data
